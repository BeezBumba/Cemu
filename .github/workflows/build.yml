name: Build and Deploy Cemu

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_major:
        description: 'Major Version'
        required: true
        default: '2'
        type: string
      version_minor:
        description: 'Minor Version'
        required: true
        default: '6'
        type: string

permissions:
  contents: write
  packages: write

env:
  VCPKG_ROOT: "${{ github.workspace }}/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'
  VCPKG_FORCE_DOWNLOADED_BINARIES: true
  VER_MAJOR: ${{ github.event.inputs.version_major || '2' }}
  VER_MINOR: ${{ github.event.inputs.version_minor || '6' }}

jobs:
  build-ubuntu:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
          - os: ubuntu-22.04-arm
            arch: arm

    name: build-ubuntu-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup release mode parameters
        run: |
          echo "BUILD_MODE=release" >> $GITHUB_ENV
          echo "BUILD_FLAGS=-DEMULATOR_VERSION_MAJOR=${{ env.VER_MAJOR }} -DEMULATOR_VERSION_MINOR=${{ env.VER_MINOR }}" >> $GITHUB_ENV

      - name: "Install system dependencies"
        run: |
          sudo apt update -qq
          sudo apt install -y clang-15 cmake freeglut3-dev libgcrypt20-dev libglm-dev libgtk-3-dev libpulse-dev libsecret-1-dev libsystemd-dev libudev-dev nasm ninja-build libbluetooth-dev

      - name: "Bootstrap vcpkg"
        run: |
          bash ./dependencies/vcpkg/bootstrap-vcpkg.sh

      - name: "Setup NuGet Credentials for vcpkg"
        shell: bash
        run: |
          mono `./dependencies/vcpkg/vcpkg fetch nuget | tail -n 1` \
          sources add \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
          -storepasswordincleartext \
          -name "GitHub" \
          -username "${{ github.repository_owner }}" \
          -password "${{ secrets.GITHUB_TOKEN }}"
          mono `./dependencies/vcpkg/vcpkg fetch nuget | tail -n 1` \
          setapikey "${{ secrets.GITHUB_TOKEN }}" \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: "cmake"
        run: |
          cmake -S . -B build ${{ env.BUILD_FLAGS }} -DCMAKE_BUILD_TYPE=${{ env.BUILD_MODE }} -DCMAKE_C_COMPILER=/usr/bin/clang-15 -DCMAKE_CXX_COMPILER=/usr/bin/clang++-15 -G Ninja -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja

      - name: "Build Cemu"
        run: |
          cmake --build build

      - name: Prepare artifact
        run: mv bin/Cemu_release bin/Cemu

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cemu-bin-linux-${{ matrix.arch }}
          path: ./bin/Cemu

  build-appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
          - os: ubuntu-22.04-arm
            arch: arm

    name: build-appimage-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    needs: build-ubuntu
    steps:
      - name: Checkout Upstream Repo
        uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: cemu-bin-linux-${{ matrix.arch }}
          path: bin

      - name: "Install system dependencies"
        run: |
          sudo apt update -qq
          sudo apt install -y clang-15 cmake freeglut3-dev libgcrypt20-dev libglm-dev libgtk-3-dev libpulse-dev libsecret-1-dev libsystemd-dev nasm ninja-build appstream libbluetooth-dev

      - name: "Build AppImage"
        run: |
          export LD_LIBRARY_PATH="/usr/local/lib:$LD_LIBRARY_PATH"
          export DEPLOY_GTK_VERSION=3
          dist/linux/appimage.sh ${{ runner.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cemu-appimage-${{ matrix.arch }}
          path: artifacts

  build-windows:
    runs-on: windows-2022
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Setup release mode parameters
        run: |
          echo "BUILD_MODE=release" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
          echo "BUILD_FLAGS=-DEMULATOR_VERSION_MAJOR=${{ env.VER_MAJOR }} -DEMULATOR_VERSION_MINOR=${{ env.VER_MINOR }}" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: "Setup cmake"
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: "Bootstrap vcpkg"
        run: |
          ./dependencies/vcpkg/bootstrap-vcpkg.bat

      - name: "Setup NuGet Credentials for vcpkg"
        shell: bash
        run: |
          `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
          sources add \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
          -storepasswordincleartext \
          -name "GitHub" \
          -username "${{ github.repository_owner }}" \
          -password "${{ secrets.GITHUB_TOKEN }}"
          `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
          setapikey "${{ secrets.GITHUB_TOKEN }}" \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: "cmake"
        run: |
          mkdir -p build
          cd build
          cmake .. ${{ env.BUILD_FLAGS }} -DCMAKE_BUILD_TYPE=${{ env.BUILD_MODE }} -DVCPKG_INSTALL_OPTIONS="--clean-after-build" "-DCMAKE_EXE_LINKER_FLAGS_RELEASE=/INCREMENTAL:NO /PDBALTPATH:Cemu.pdb"

      - name: "Build Cemu"
        run: |
          cd build
          cmake --build . --config ${{ env.BUILD_MODE }}

      - name: Prepare artifact
        run: |
          Rename-Item bin/Cemu_release.exe Cemu.exe
          Rename-Item bin/Cemu_release.pdb Cemu.pdb

      - name: Build NSIS Installer
        shell: cmd
        run: |
          cd src\resource
          makensis /DPRODUCT_VERSION=${{ env.VER_MAJOR }}.${{ env.VER_MINOR }} installer.nsi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cemu-bin-windows-x64
          path: |
            ./bin/Cemu.exe
            ./bin/Cemu.pdb

      - name: Upload NSIS Installer
        uses: actions/upload-artifact@v6
        with:
          name: cemu-installer-windows-x64
          path: ./src/resource/cemu-${{ env.VER_MAJOR }}.${{ env.VER_MINOR }}-windows-x64-installer.exe

  deploy-release:
    name: Deploy to GitHub Releases
    runs-on: ubuntu-latest
    needs: [build-appimage, build-windows]
    if: always() && (needs.build-appimage.result == 'success' || needs.build-windows.result == 'success')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Flatten release files
        run: |
          mkdir -p dist-files
          find release-assets -type f -exec cp {} dist-files/ \;
          ls -la dist-files

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Cemu ${{ env.VER_MAJOR }}.${{ env.VER_MINOR }} (Build #${{ github.run_number }})
          prerelease: true
          generate_release_notes: true
          files: dist-files/*
